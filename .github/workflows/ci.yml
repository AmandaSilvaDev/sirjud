name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.19"

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    name: Pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sirjud
          POSTGRES_USER: sirjud
          POSTGRES_PASSWORD: sirjud
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sirjud" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://sirjud:sirjud@127.0.0.1:5432/sirjud
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen
      - run: uv run python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - run: uv run pytest --cov --cov-report=term-missing

  security:
    name: Bandit e pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen
      # Falha em achados de severidade média ou alta.
      - run: uv run bandit -c pyproject.toml -r apps config -ll
      - name: pip-audit (dependências de produção travadas no uv.lock)
        run: |
          uv export --frozen --no-dev --format requirements-txt > /tmp/requirements.txt
          uv run pip-audit --strict --requirement /tmp/requirements.txt --disable-pip

  secrets:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-check:
    name: manage.py check --deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen --no-dev
      # Valores descartáveis só para carregar as settings de produção.
      - run: uv run python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_ENV: production
          DJANGO_SECRET_KEY: ci-only-${{ github.run_id }}-not-a-real-secret-0123456789abcdefghijklmnopqrstuvwxyz
          ALLOWED_HOSTS: sirjud.example.com
          DATABASE_URL: postgres://ci@127.0.0.1:5432/ci
          FIELD_ENCRYPTION_KEYS: ci:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          SEARCH_HMAC_KEY: ci-only
